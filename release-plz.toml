[workspace]
# Disable git tags and GitHub Releases. Creating tags requires contents:write,
# and any CI workflow with that permission can tag arbitrary commits — including
# unreviewed code on feature branches, bypassing branch protection entirely.
# Since crates.io is the actual distribution channel, we avoid the risk by
# skipping GitHub Releases and relying on crates.io version history instead.
git_tag_enable = false
git_release_enable = false
pr_labels = ["release"]
# Put the changelog first and keep cargo-semver-checks output collapsed below it.
pr_body = """
{% set changes %}

{%- for release in releases %}

{%- if release.title and release.changelog %}{% if releases | length > 1 %}

## `{{ release.package }}`

{% endif %}

<blockquote>

## {{ release.title }}

{{ release.changelog }}

</blockquote>{% endif %}

{% endfor %}

{% endset %}

## 🤖 New release

{% for release in releases %}

* `{{ release.package }}`: {% if release.previous_version and release.previous_version != release.next_version %}{{ release.previous_version }} -> {% endif %}{{ release.next_version }}{% if release.semver_check == "incompatible" %} (⚠ API breaking changes){% elif release.semver_check == "compatible" %} (✓ API compatible changes){% endif %}

{%- endfor %}

{% if changes %}

<details><summary><h3>Changelog</h3></summary><p>

{{ changes }}

</p></details>

{% endif %}

{%- for release in releases %}{% if release.breaking_changes %}

<details><summary><h3>⚠ breaking changes report</h3></summary><p>

```text
{{ release.breaking_changes }}
```

</p></details>
{% endif %}{% endfor %}

---
This PR was generated with [release-plz](https://github.com/release-plz/release-plz/).
"""

[[package]]
name = "substrait-explain"
# Use the 'protoc' feature to publish - needed in CI
publish_features = ["protoc"]

[changelog]
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^ci", skip = true },
    { message = "^chore", skip = true },
]
